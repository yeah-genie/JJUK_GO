name: ci

on:
  push:
    paths-ignore: ["docs/**/*.md", "reports/**", "research_notes/**", "*.md"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Install Korean font for replay tests
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-nanum
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python scripts/build_prototype.py
      - run: git diff --exit-code -- docs/prototype/index.html
      - run: node scripts/check_profile.cjs
      - run: node scripts/check_walk_logic.cjs
      - run: node scripts/check_app_shell.cjs

      - run: node scripts/check_places.cjs
      - run: node scripts/check_events.cjs

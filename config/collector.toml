# 쭉고 신호 수집기 설정
# 자세한 설명은 docs/DATA_COLLECTION.md 참고

[api]
# C-ITS 신호 현시 + 잔여시간 결합 정보 (서울교통빅데이터플랫폼)
base_url = "https://t-data.seoul.go.kr/apig/apiman-gateway/tapi/v2xSignalPhaseTimingFusionInformation/1.0"
num_of_rows = 1000
timeout_s = 20
max_retries = 3
# 일괄 조회 모드에서 한 번 실행에 넘기지 않을 최대 페이지 수 (총 건수를 모를 때의 안전장치)
max_pages = 10
# 교차로 ID 없이 호출했을 때 서로 다른 교차로가 이 수 이상 오면 "전체 일괄 조회"로 본다.
# (실제 응답은 최근 메시지 1,000건에 교차로가 2곳뿐이어서 일괄 조회가 아니었다.)
bulk_min_intersections = 20
# 교차로별 호출 한 번에 받을 최대 메시지 수. 메시지는 교차로당 약 1초에 1건, 서버는 약 35분치를 보관한다(2026-10-28 실측).
# 실제로는 지난 수집 이후 쌓인 만큼만(최소 min_rows) 받는다.
rows_per_intersection = 2200
min_rows = 300
# 호출 간격 제한(300초에 1회)에 걸렸을 때 이 시간(초) 이내면 기다렸다가 다시 부른다.
rate_limit_wait_max_s = 330

[budget]
# 하루 호출 한도 (KST 자정 기준). 공식 한도가 확인되면 수정.
daily_limit = 1000
# 수집기가 쓸 비율. 나머지는 서비스 실시간 조회용으로 남겨둔다.
collect_share = 0.7
# 수집 간격(분). API가 키 전체에 300초 1회로 제한하므로 5분. (하루 최대 288회)
# collect.yml의 loop가 이 간격으로 once를 반복한다.
run_interval_min = 5
calls_per_run = 1
# 출퇴근·점심 시간대(KST)에 호출을 더 배정한다.
peak_hours = [7, 8, 9, 12, 13, 18, 19]
peak_weight = 2.0

[targets]
# 직접 지정한 교차로 ID. 비어 있으면 targets_csv + bbox로 고른다.
# 테헤란로 역삼역–선릉역 구간(약 1.1km). 전국 교차로 목록(static/seoul_crossings.csv, 2026-10-28)에서 골랐다.
# 하루 288회 / 5분 간격이면 교차로당 35분마다 한 번 → 7곳이면 끊김 없이 이어진다.
itst_ids = [
  "2217",  # 역삼역
  "2975",  # 고등교육재단
  "2219",  # 르네상스호텔
  "4500",  # KT강남지사 (르네상스호텔 옆길)
  "2974",  # 국민은행테헤란로
  "2212",  # 선릉역
  "3011",  # 진선여고 (선릉역 옆길)
  "1537",  # 정동 (광화문–시청, 주기 140초로 확신 높음)
  "1619",  # 서울역사박물관
  "2691",  # 구세군회관앞
]
# 서울 C-ITS 교차로 전체(config/crawl_ids.txt, 2,779곳)를 한 곳씩 훑는다. 3번 중 1번(약 96회/일)을 여기에 쓰고,
# 나머지는 위 핵심 구간을 깊게 모은다. 한 번 부르면 약 35분치를 받으므로 전체를 한 바퀴 도는 데 약 29일.
# 0이면 훑기를 끈다.
crawl_ids_file = "config/crawl_ids.txt"
crawl_every = 3
# 교차로 목록 CSV (교차로 ID, 위도, 경도 열을 자동 인식). 없으면 무시.
targets_csv = "config/targets.csv"
# 강남역–역삼–선릉 일대: [경도_min, 위도_min, 경도_max, 위도_max]
bbox = [127.020, 37.493, 127.055, 37.512]

[store]
# 저장할 신호 종류. Pd=보행, St=직진, Lt=좌회전, Ut=유턴, Bs=버스, Bc=자전거
movements = ["Pd"]
# 1초 단위 원본도 저장할지. 끄면 상태 구간(segments/)만 저장해 저장소가 작게 유지된다.
raw = false

[static]
# 주 1회 내려받을 정적 파일. url에 {apiKey}를 넣으면 API 키로 치환된다.
# 예: { name = "itst_map", url = "https://..." }
sources = []

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>쭉고 추가 화면 시안 갤러리</title>
<style>/* 쭉고 추가 화면 갤러리 — Asphalt 토큰. 클래스 이름은 docs/DESIGN_SYSTEM.md 5절 컴포넌트와 대응한다. */
:root{
  --bg:#242A32; --surface:#303844; --line:#46505D; --control-line:#8793A3;
  --text:#F4F2E9; --muted:#B7BEC8; --yellow:#F6C343; --on-yellow:#242A32;
  --map-road:#89918F; --map-land:#39414B; --map-park:#3E5948; --map-label:#F4F2E9;
  --you:#4A9BFF; --scrim:rgba(13,17,22,.68); --disabled:#3A424D;
  --gutter:18px; --radius-ctl:12px; --radius-sheet:16px;
  --font:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --page-bg:#171B20;
}
*{box-sizing:border-box;scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
html{background:var(--page-bg)}
body{margin:0;background:var(--page-bg);color:var(--text);font:400 16px/1.5 var(--font)}

/* ---- 갤러리 바깥 (프레임 밖) ---- */
.page-head{max-width:1280px;margin:0 auto;padding:32px 24px 8px}
.page-head h1{font-size:24px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.page-head p{max-width:760px;margin:0 0 14px;color:var(--muted);font-size:15px}
.page-head nav{display:flex;flex-wrap:wrap;gap:8px}
.page-head nav a{color:var(--text);text-decoration:none;border:1px solid var(--control-line);border-radius:12px;padding:10px 14px;font-size:15px;min-height:44px;display:inline-flex;align-items:center}
.badge{display:inline-block;font-size:12.5px;font-weight:600;color:var(--yellow);border:1px solid var(--yellow);border-radius:6px;padding:1px 7px;line-height:1.5}
.group{max-width:1280px;margin:0 auto;padding:24px 24px 8px}
.group-title{font-size:20px;margin:0 0 16px;padding-top:8px;border-top:1px solid var(--line)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,max-content));gap:40px 32px;align-items:start}
.shot{margin:0;max-width:100%}
.shot figcaption{margin:0 0 10px;max-width:390px}
.shot h3{margin:0;font-size:17px}
.shot h3 a{color:var(--text);text-decoration:none}
.cap-state{margin:2px 0 6px;color:var(--muted);font-size:14px}
.cap-meta{margin:0;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12.5px;color:var(--muted)}
.cap-meta code{font:12.5px/1.4 ui-monospace,Menlo,monospace;color:var(--muted)}
.shot:target{grid-column:1/-1}
.shot:target .frame{zoom:1.35}

/* ---- 프레임 (390×844, 베젤 없음) ---- */
.frame{position:relative;width:390px;height:844px;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--font);overflow:hidden;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;word-break:keep-all}
.frame.f360{width:360px;height:640px;--gutter:16px}
.frame :where(button){font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:inherit;cursor:default}
.frame :where(h1,h2,p){margin:0}
.sian{position:absolute;right:var(--gutter);bottom:8px;z-index:20;font-size:12.5px;line-height:1.4;color:var(--muted)}
.scroll-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)} .muted-strong{color:var(--muted);font-weight:600}
.muted-inline{color:var(--muted);font-weight:400}

/* 아이콘 */
.ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic-sm{width:18px;height:18px} .ic-lg{width:26px;height:26px} .ic-xl{width:36px;height:36px}
.ic-muted{color:var(--muted)}
.mk{width:26px;height:26px;flex:none}

/* 상단바 · 브랜드 */
.topbar{flex:none;height:68px;padding:20px var(--gutter) 0;display:flex;align-items:center;justify-content:space-between}
.topbar .icon-btn:last-child{margin-right:-12px}
.brand{display:inline-flex;align-items:center;gap:7px;font-size:23px;font-weight:900;letter-spacing:-.5px;line-height:1}
.brand-mark{width:34px;height:14px}
.topbar--title{padding-left:6px;padding-right:var(--gutter)}
.topbar--title .icon-btn:first-child{margin-left:0}
.topbar-title{font-size:20px;font-weight:700;line-height:1.3;text-align:center}
.topbar-stack{flex:1;display:flex;flex-direction:column;align-items:center}
.topbar-sub{font-size:13px;color:var(--muted);line-height:1.3}
.topbar-side{width:44px;flex:none;text-align:right}
.topbar--title .topbar-title{flex:1}
.topbar--search{gap:2px;padding-left:6px;justify-content:flex-start}
.topbar--search .icon-btn:last-child{margin-right:0}
.icon-btn{width:48px;height:48px;min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;flex:none;border-radius:50%}
.icon-btn--sm{width:44px;height:44px}
.icon-btn--ring{border:1.5px solid var(--control-line);border-radius:12px}
.link-btn{min-height:44px;min-width:44px;justify-content:flex-end;display:inline-flex;align-items:center;gap:4px;font-size:16px;color:var(--yellow);text-decoration:underline;text-underline-offset:4px}
.link-btn--muted{color:var(--muted);text-decoration:none}
.link-btn--inline{margin:2px 0 0 -2px}
.link-btn .ic-sm{margin-top:1px}

/* 검색 · 출발 */
.search{flex:none;margin:0 var(--gutter);height:48px;border:1px solid var(--control-line);background:var(--surface);border-radius:var(--radius-ctl);display:flex;align-items:center;gap:12px;padding:0 14px;color:var(--muted);font-size:17px}
.search--input{flex:1;margin:0 var(--gutter) 0 0;padding-right:2px;color:var(--text)}
.search--input.is-focus{border:2px solid var(--yellow);padding-left:13px}
.search-text{flex:1;font-size:17px}
.from-row{flex:none;display:flex;align-items:center;gap:10px;min-height:52px;margin:0 var(--gutter);font-size:17px}
.from-row strong{font-weight:700}
.from-row .link-btn{margin-left:auto}

/* 지도 */
.map{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--map-land)}
.map-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.map--mini{--ml:6.2px;--mls:1.6px;flex:none;height:124px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ml{font:600 var(--ml,12.5px) var(--font);fill:var(--map-label);paint-order:stroke;stroke:#1B2027;stroke-width:var(--mls,3.4px);stroke-linejoin:round}
.ml-big{font-size:var(--mlb,15px);font-weight:800}
.map-chip{position:absolute;top:12px;left:12px;height:44px;padding:0 16px 0 12px;border-radius:22px;background:rgba(36,42,50,.94);display:inline-flex;align-items:center;gap:8px;font-size:15px;font-weight:600}
.map-chip--bl{top:auto;bottom:12px;font-size:14.5px}
.map-ctl{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.map-btn{width:48px;height:48px;border-radius:50%;background:rgba(36,42,50,.94);display:inline-flex;align-items:center;justify-content:center}
.map-btn--br{position:absolute;right:12px;bottom:12px;width:52px;height:52px}
.zoom{width:48px;border-radius:12px;background:rgba(36,42,50,.94);display:flex;flex-direction:column;overflow:hidden}
.zoom button{height:48px;display:flex;align-items:center;justify-content:center}
.zoom button+button{border-top:1px solid var(--line)}
.legend{position:absolute;left:12px;bottom:12px;height:48px;padding:0 14px 0 10px;border-radius:14px;background:rgba(36,42,50,.94);display:flex;align-items:center;gap:8px;font-size:14px}
.legend-item{display:inline-flex;align-items:center;gap:6px}
.legend-sep{width:1px;height:24px;background:var(--line);margin:0 4px}

/* 행 · 목록 */
.rows{margin:0 var(--gutter)}
.row{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:8px 0;border-top:1px solid var(--line);margin:0}
.rows>.row:first-child{border-top:0}
.row--link{text-align:left}
.row-title{display:block;font-size:17px;font-weight:600;line-height:1.35}
.row-title--muted{color:var(--muted)}
.row-desc{display:block;font-size:14px;color:var(--muted);line-height:1.45;margin-top:1px}
.row-eyebrow{font-size:13.5px;color:var(--muted);margin-bottom:2px}
.row-big{font-size:22px;font-weight:700;line-height:1.3}
.row--stack{flex-direction:column;align-items:stretch;gap:10px;padding:12px 0}
.row--kv{min-height:50px;font-size:16px}
.sub{display:block;font-size:13.5px;color:var(--muted)}
.kv-num{font-size:18px;font-weight:700}
.section-title{flex:none;font-size:17px;font-weight:700;margin:0 var(--gutter);padding:12px 0 4px}
.section-title--tight{padding-top:20px;margin-bottom:0}
.status-row{flex:none;display:flex;align-items:center;gap:12px;min-height:56px;margin:0 var(--gutter);font-size:17px;font-weight:600}
.status-label{flex:1;min-width:0}
.status-row .link-btn{font-weight:400;font-size:15px}
.eyebrow{font-size:14px;color:var(--muted)}

/* 설정 */
.settings{padding:0 var(--gutter)}
.settings>.row{padding:10px 0}
.settings>.row:first-child{border-top:0;min-height:76px}
.row--set .row-title{font-size:18px}
.row--status{flex-direction:column;align-items:flex-start;gap:0;padding:22px 0}
.settings>.row--link .row-title{font-size:18px}
.settings>.row--link{min-height:66px}

/* 토글 */
.toggle{flex:none;position:relative;width:54px;height:32px;border-radius:16px;border:2px solid var(--control-line);display:inline-block}
.toggle::after{content:"";position:absolute;inset:-9px -5px}
.toggle .thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--control-line)}
.toggle.is-on{background:var(--yellow);border-color:var(--yellow)}
.toggle.is-on .thumb{left:25px;background:#F7F5EC}

/* 설문 */
.onb{padding:0}
.progress{margin:28px var(--gutter) 0}
.progress-count{font-size:17px;color:var(--muted)}
.progress-count strong{color:var(--yellow);font-size:20px}
.progress-bars{display:flex;gap:6px;margin-top:6px}
.progress-bars i{display:block;width:26px;height:5px;border-radius:3px;background:var(--line)}
.progress-bars i.is-on{background:var(--yellow)}
.onb-title{margin:30px var(--gutter) 0;font-size:28px;line-height:1.3;font-weight:800;letter-spacing:-.4px}
.onb-sub{margin:8px var(--gutter) 0;font-size:16px;color:var(--muted)}
.onb .rows{margin-top:26px}
.onb-note{margin:14px var(--gutter) 24px;font-size:14.5px;color:var(--muted)}
.choice-row{display:flex;align-items:center;min-height:64px;border-bottom:1px solid var(--line);padding:0 4px}
.choice-label{flex:1;font-size:18px;font-weight:600}
.mark{flex:none;width:26px;height:26px;border:2px solid var(--control-line);display:inline-flex;align-items:center;justify-content:center}
.mark--box{border-radius:7px}
.mark--radio{border-radius:50%}
.mark.is-on{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow)}
.mark .ic{width:20px;height:20px;stroke-width:3}
.choice-row.is-selected .choice-label{color:var(--text)}

/* 행동 바 · 버튼 */
.action-bar{flex:none;padding:12px var(--gutter) 30px;background:var(--bg)}
.action-note{font-size:15px;color:var(--muted);margin:0 0 10px}
.action-btns{display:flex;gap:8px}
.btn{height:52px;min-height:48px;border-radius:var(--radius-ctl);font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;white-space:nowrap;text-align:center!important}
.btn-primary{flex:1;background:var(--yellow);color:var(--on-yellow)}
.btn-secondary{border:1.5px solid var(--control-line);color:var(--text);flex:none;min-width:98px}
.action-btns>.btn-secondary:only-child{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}
.stack .btn{width:100%;flex:none}

/* 출발·도착 툴바 */
.od-toolbar{flex:none;display:flex;align-items:center;gap:4px;padding:14px var(--gutter) 6px 6px}
.od-toolbar .icon-btn:last-child{margin-right:-8px}
.od-rows{flex:1;min-width:0;padding:0 8px 0 4px}
.od-row{display:flex;align-items:center;gap:14px;height:40px;font-size:17px;font-weight:600}
.od-row+.od-row{}
.od-row:first-child{border-bottom:1px solid var(--line)}
.od-dot{flex:none;width:12px;height:12px;border-radius:50%}
.od-dot--from{border:2px solid var(--text)}
.od-dot--to{background:var(--yellow)}
.od-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 결과 패널 · 경로 행 */
.panel{flex:none;background:var(--bg)}
.route-head{display:flex;justify-content:space-between;padding:8px var(--gutter) 6px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);margin:0 0;}
.route-head span:last-child{color:var(--yellow)}
.route-head{margin:0 var(--gutter);padding-left:0;padding-right:0;border-top:1px solid var(--line)}
.route-row{position:relative;display:grid;grid-template-columns:minmax(112px,1.05fr) minmax(104px,1fr) minmax(100px,.9fr);align-items:stretch;min-height:62px;margin:0 var(--gutter);border-top:1px solid var(--line)}
.route-row.is-selected::before{content:"";position:absolute;left:0;top:11px;bottom:11px;width:4px;border-radius:2px;background:var(--yellow)}
.route-row .cell{display:flex;align-items:center;padding:0 10px}
.cell-name{font-size:16px;font-weight:600;padding-left:14px!important;line-height:1.3}
.route-row .cell-time{border-left:1px solid var(--line);gap:6px;flex-wrap:wrap;align-content:center}
.cell-time strong{font-size:26px;font-weight:700;letter-spacing:-.5px;line-height:1.15}
.cell-time small{font-size:14px;color:var(--muted)}
.route-row .cell-margin{border-left:1px solid var(--line);justify-content:flex-end;text-align:right}
.margin-wait{font-size:14px;color:var(--muted);line-height:1.35}
.route-row.compact{min-height:56px}
.unknown-link{margin:0 var(--gutter);width:calc(100% - 2 * var(--gutter));min-height:56px;border-top:1px solid var(--line);font-size:16px;font-weight:500;gap:12px}
.rows--tight{margin-top:0}
.rows--tight .row{min-height:60px}
.rows--tight>.row:first-child{border-top:1px solid var(--line)}

/* 시트 */
.scrim{position:absolute;inset:0;z-index:10;background:var(--scrim)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:11;max-height:86%;display:flex;flex-direction:column;background:var(--surface);border-radius:var(--radius-sheet) var(--radius-sheet) 0 0;border-top:1px solid var(--control-line);padding-bottom:30px}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--control-line);margin:8px auto 0;flex:none}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:4px 8px 0 var(--gutter);min-height:56px}
.sheet-head h2{font-size:20px;font-weight:700;line-height:1.3}
.sheet-body{padding:0 var(--gutter);overflow-y:auto;min-height:0}
.sheet-body>.row:first-child{border-top:0}
.sheet-body .row-title{font-size:17px}
.sheet-foot{flex:none;padding:14px var(--gutter) 0}
.sheet-text{font-size:16px;color:var(--text);line-height:1.55}
.sheet-text--small{font-size:14px;color:var(--muted);margin-top:8px}
.sheet-body>.sheet-text:first-child{margin-top:2px;margin-bottom:6px}

/* 태그 (추정·미확인·기록·임시: 색 말고 모양/글로 구분) */
.tag{flex:none;font-size:13px;font-weight:600;line-height:1.4;padding:2px 9px;border-radius:7px;border:1px solid var(--control-line);color:var(--text);white-space:nowrap}
.tag--est{border-style:dotted;border-width:1.5px}
.tag--unk{border-style:dashed;color:var(--muted)}
.tag--temp{border-color:var(--yellow);color:var(--yellow)}

/* 칩 */
.chips{display:flex;gap:8px}
.chip{flex:1;min-width:0;height:46px;border:1.5px solid var(--control-line);border-radius:var(--radius-ctl);display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:16px;font-weight:600;text-align:center!important}
.chip.is-selected{background:var(--yellow);border-color:var(--yellow);color:var(--on-yellow);font-weight:700}

/* 안내 · 빈 상태 */
.notice{flex:none;display:flex;gap:12px;margin:0 var(--gutter);padding:14px 0;border-top:1px solid var(--line)}
.notice h2{font-size:17px;font-weight:700;line-height:1.35}
.notice p{font-size:14.5px;color:var(--muted);margin-top:2px;line-height:1.5}
.notice .ic-lg{margin-top:1px}
.notice--flat{border-top:1px solid var(--line)}
.empty-state{margin:56px var(--gutter) 0;display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.empty-state h2{font-size:20px;font-weight:700;margin-top:6px}
.empty-state p{font-size:16px;color:var(--muted)}
.empty-state .btn{margin-top:14px;align-self:stretch}
mark{background:none;color:var(--yellow);font-weight:800}

/* 횡단 상세 */
.demo-strip{flex:none;padding:8px var(--gutter);font-size:13.5px;color:var(--muted);background:var(--surface);border-top:1px solid var(--line)}
.detail{padding:0 var(--gutter) 16px}
.detail .section-title{margin-left:0;margin-right:0;padding-left:0}
.frame>.scroll-body:last-child{margin-bottom:30px}
.detail-head{padding:14px 0 12px}
.big-row{display:flex;align-items:center;gap:12px;margin:2px 0}
.big{font-size:32px;font-weight:700;color:var(--yellow);line-height:1.2;letter-spacing:-.5px}
.unit{font-size:16px;color:var(--muted)}
.detail .row--kv{border-top:1px solid var(--line)}
.detail-head+.row{border-top:1px solid var(--line)}

/* 직접 정하기 */
.manual{padding:22px 0 8px;border-top:1px solid var(--line)}
.manual .big{color:var(--text);font-size:32px}
.slider-row{display:flex;align-items:center;gap:8px;margin-top:20px}
.range{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:44px;margin:0;background:transparent}
.range::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--yellow) var(--p),var(--line) var(--p))}
.range::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-11px;border-radius:50%;background:var(--text);border:3px solid var(--yellow)}
.range::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
.range::-moz-range-progress{height:6px;border-radius:3px;background:var(--yellow)}
.range::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--text);border:3px solid var(--yellow)}
.range-ends{display:flex;justify-content:space-between;padding:0 62px;font-size:13.5px;color:var(--muted)}
.plain-note{margin:18px 0 0;padding-top:16px;border-top:1px solid var(--line);font-size:14.5px;color:var(--muted)}

/* 걷는 중 */
.turn-bar{flex:none;display:flex;align-items:center;gap:16px;min-height:92px;padding:22px var(--gutter) 12px;background:var(--surface);border-bottom:1px solid var(--line)}
.turn-ic{width:52px;height:52px;border-radius:12px;background:var(--yellow);color:var(--on-yellow);display:inline-flex;align-items:center;justify-content:center;flex:none}
.turn-dist{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.4px}
.turn-text{font-size:16px;color:var(--muted);margin-top:2px}
.turn-eyebrow{font-size:13px;color:var(--muted);line-height:1.3}
.turn-bar--dim .turn-ic{background:var(--line);color:var(--muted)}
.turn-bar--dim .turn-dist{font-size:24px;color:var(--muted)}
.metrics{display:flex;margin:0 var(--gutter);border-top:1px solid var(--line)}
.metric{flex:1;padding:12px 0 12px}
.metric+.metric{border-left:1px solid var(--line);padding-left:16px}
.metric small{display:block;font-size:13.5px;color:var(--muted)}
.metric strong{font-size:26px;font-weight:700;line-height:1.2}
.f360 .turn-bar{min-height:80px;padding-top:16px}
.f360 .metric{padding:8px 0}
.f360 .status-row{min-height:48px}
.f360 .onb-title{font-size:26px;margin-top:20px}
.f360 .progress{margin-top:12px}
.f360 .topbar{height:60px;padding-top:14px}
